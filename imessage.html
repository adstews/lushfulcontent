<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>iMessage Console — Lushful Aesthetics</title>

<link rel="manifest" href="/imessage-manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iMessage">
<link rel="apple-touch-icon" href="/imessage-apple-touch.png">
<link rel="icon" type="image/png" sizes="192x192" href="/imessage-icon-192.png">

<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d2230;
    --line: #262c3a;
    --text: #e7ecf3;
    --muted: #8a93a6;
    --accent: #2f7dff;
    --accent-2: #4f9bff;
    --in-bubble: #232838;
    --out-bubble: #2f7dff;
    --danger: #ff5c5c;
    --ok: #38d39f;
    --unread-badge: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-2); }

  /* Login screen */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; }
  .login h1 { margin: 0 0 4px; font-size: 18px; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .login input { width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 12px; }
  .login button { width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--accent); border: 0; color: white; font-weight: 600; cursor: pointer; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* App layout */
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100dvh; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .app.has-thread .threads { display: none; }
    .app:not(.has-thread) .thread { display: none; }
  }

  .threads { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .threads-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px;
    background: var(--panel);
    position: sticky; top: 0;
  }
  .threads-head h2 { margin: 0; font-size: 14px; flex: 1; letter-spacing: .02em; }
  .icon-btn { background: transparent; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .icon-btn:hover { color: var(--text); background: var(--panel-2); }
  .icon-btn.active { color: var(--accent-2); }

  .threads-list { overflow: auto; flex: 1; }
  .thread-item { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
  .thread-item:hover, .thread-item.active { background: var(--panel-2); }
  .thread-item .name { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .thread-item.has-unread .name { color: var(--text); }
  .thread-item .name .at { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: auto; }
  .thread-item .preview { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 28px; }
  .thread-item.has-unread .preview { color: var(--text); }
  .thread-item .preview.outbound::before { content: "↳ "; color: var(--accent-2); }
  .badge {
    background: var(--unread-badge); color: white;
    font-size: 11px; font-weight: 700;
    border-radius: 10px; padding: 2px 7px; min-width: 18px; text-align: center;
    position: absolute; right: 12px; bottom: 12px;
  }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  .thread { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .thread-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; background: var(--panel); min-height: 52px; }
  .thread-head .name { font-weight: 600; }
  .thread-head .meta { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .back-btn { display: none; }
  @media (max-width: 720px) { .back-btn { display: inline-flex; } }

  .messages { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 16px; line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; position: relative; }
  .msg.inbound { background: var(--in-bubble); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.outbound { background: var(--out-bubble); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .at { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .msg.outbound .at { color: rgba(255,255,255,.7); }
  .msg .media { display: block; margin: -2px -4px 6px -4px; border-radius: 12px; overflow: hidden; max-width: 100%; }
  .msg .media img, .msg .media video {
    display: block; width: 100%; max-height: 360px; object-fit: cover;
    border-radius: 12px;
  }
  .msg .media video { background: black; }

  /* Reaction badges anchored to the top of a bubble */
  .msg .reactions {
    position: absolute;
    top: -10px;
    display: flex; gap: 3px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2px 6px;
    font-size: 13px;
    line-height: 1;
    z-index: 1;
  }
  .msg.inbound .reactions { left: 8px; }
  .msg.outbound .reactions { right: 8px; }

  /* Reaction picker popover */
  .react-picker {
    position: absolute;
    display: flex; gap: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 6px 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    z-index: 200;
  }
  .react-picker button {
    background: transparent; border: 0; color: var(--text);
    font-size: 20px; line-height: 1; padding: 4px 6px; border-radius: 50%;
    cursor: pointer;
  }
  .react-picker button:hover { background: var(--panel-2); }
  .react-picker .picked { background: var(--out-bubble); }

  /* Attachment preview chip in composer */
  .attach-preview {
    display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; font-size: 13px;
  }
  .attach-preview img, .attach-preview video {
    width: 36px; height: 36px; object-fit: cover; border-radius: 6px;
  }
  .attach-preview .filename { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attach-preview .remove { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
  .attach-btn { padding: 10px 12px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
  .attach-btn:hover { color: var(--text); }
  .composer-inner { flex: 1; display: flex; flex-direction: column; }
  .composer { align-items: flex-end; }

  .composer { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); display: flex; gap: 8px; align-items: end; }
  .composer textarea { flex: 1; resize: none; min-height: 40px; max-height: 160px; padding: 10px 12px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line); }
  .composer button { padding: 10px 16px; border-radius: 18px; background: var(--accent); border: 0; color: white; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }

  .placeholder { flex: 1; display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 24px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 10px; font-size: 13px; z-index: 50; }
  .toast.err { border-color: var(--danger); }
  .toast.ok { border-color: var(--ok); }

  /* Modal (used for compose) */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: grid; place-items: center;
    padding: 16px; z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    width: 100%; max-width: 480px;
    max-height: 86dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .modal-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .modal-body { padding: 14px 16px; overflow: auto; }
  .modal-body input, .modal-body textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .modal-body textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .modal-body label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .lead-results { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin-bottom: 10px; }
  .lead-row { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .lead-row:last-child { border-bottom: 0; }
  .lead-row:hover, .lead-row.active { background: var(--panel); }
  .lead-row .nm { font-weight: 600; font-size: 14px; }
  .lead-row .sub { color: var(--muted); font-size: 12px; }
  .modal-foot {
    padding: 12px 16px; border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .btn { padding: 9px 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); }

  /* Sequences */
  .seq-row {
    display: flex; gap: 10px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel-2); margin-bottom: 8px;
  }
  .seq-row .meta { flex: 1; min-width: 0; }
  .seq-row .nm { font-weight: 600; }
  .seq-row .sub {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seq-row .actions { display: flex; gap: 4px; }
  .seq-row .pill {
    font-size: 11px; padding: 2px 7px; border-radius: 10px;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
  }
  .seq-row .pill.on { color: var(--ok); border-color: var(--ok); }
  .seq-row .pill.off { color: var(--muted); }

  .seq-editor .seq-field { margin-bottom: 12px; }
  .seq-editor label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .seq-editor input[type=text], .seq-editor input[type=number], .seq-editor select, .seq-editor textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-family: inherit;
  }
  .seq-editor textarea { resize: vertical; min-height: 70px; }
  .seq-editor .row { display: flex; gap: 10px; align-items: flex-start; }
  .seq-editor .row > .seq-field { flex: 1; }
  .seq-step {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; margin-bottom: 8px; background: var(--panel-2);
  }
  .seq-step .step-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .seq-step .step-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: white;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .seq-step .step-head .grow { flex: 1; color: var(--muted); font-size: 12px; }

  /* Thread enrollment banner */
  .thread-banner {
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
  }
  .thread-banner.paused { background: rgba(255, 92, 92, 0.08); border-bottom-color: var(--danger); }
  .thread-banner .label { flex: 1; color: var(--muted); }
  .thread-banner .label strong { color: var(--text); }
  .thread-banner button {
    background: transparent; border: 1px solid var(--line);
    color: var(--text); padding: 4px 10px; border-radius: 8px;
    cursor: pointer; font-size: 12px;
  }
  .thread-banner button:hover { background: var(--panel); }
</style>
</head>
<body>
<div id="root"></div>

<script>
const API = '/api/sendblue/console'

const state = {
  authed: false,
  threads: [],
  loadingThreads: false,
  selectedLeadId: null,
  thread: null,
  loadingThread: false,
  sending: false,
  err: null,
  compose: null,           // { q, searching, results, leadId, phone, message, sending }
  notifications: 'unknown', // 'granted' | 'denied' | 'default' | 'unsupported' | 'unknown'
  attachment: null,         // { filename, contentType, dataBase64, previewUrl, kind: 'image'|'video' } pre-send
  reactPicker: null,        // { messageId, messageHandle, phone, currentReaction, x, y }
  mediaUploader: null,      // { uploading: bool, url: string|null, filename: string|null, error: string|null }
  sequencesModal: null,     // { view: 'list'|'edit', sequences: [], editing: seq|null, leadStatuses: [], saving: bool }
  threadEnrollments: []     // enrollments for the currently selected thread's lead
}

const REACTION_EMOJI = {
  love: '❤️', like: '👍', dislike: '👎',
  laugh: '😂', emphasize: '‼️', question: '❓'
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag)
  // Certain attributes need to be set as DOM properties, not attributes —
  // and `value` on a <select> specifically must be set AFTER its <option>
  // children are appended, otherwise the matching option doesn't get
  // selected and the displayed value is wrong.
  const deferred = {}
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') { el.className = v; continue }
    if (k.startsWith('on') && typeof v === 'function') {
      el.addEventListener(k.slice(2).toLowerCase(), v)
      continue
    }
    if (k === 'ref' && typeof v === 'function') { v(el); continue }
    if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') {
      deferred[k] = v
      continue
    }
    if (v !== false && v != null) el.setAttribute(k, v)
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c)
  }
  for (const [k, v] of Object.entries(deferred)) {
    if (v !== false && v != null) el[k] = v
  }
  return el
}

function formatTime(iso) {
  if (!iso) return ''
  const d = new Date(iso)
  const now = new Date()
  const sameDay = d.toDateString() === now.toDateString()
  if (sameDay) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
    ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
}

let toastTimer = null
function toast(msg, kind = '') {
  const old = document.querySelector('.toast')
  if (old) old.remove()
  const el = h('div', { class: `toast ${kind}` }, msg)
  document.body.appendChild(el)
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.remove(), 4000)
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opts
  })
  if (res.status === 401) {
    state.authed = false
    render()
    throw new Error('unauthorized')
  }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
  return data
}

async function tryRestoreSession() {
  try { await api('/threads'); state.authed = true }
  catch { state.authed = false }
}

async function login(password) {
  const res = await fetch(API + '/login', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  })
  if (!res.ok) {
    const data = await res.json().catch(() => ({}))
    throw new Error(data.error || `HTTP ${res.status}`)
  }
  state.authed = true
}

async function logout() {
  await fetch(API + '/login', { method: 'DELETE', credentials: 'same-origin' })
  state.authed = false
  state.threads = []
  state.thread = null
  state.selectedLeadId = null
  render()
}

async function loadThreads() {
  state.loadingThreads = true; render()
  try {
    const { threads } = await api('/threads')
    state.threads = threads
  } catch (err) {
    toast(`Failed to load threads: ${err.message}`, 'err')
  } finally {
    state.loadingThreads = false; render()
  }
}

async function selectThread(leadId) {
  state.selectedLeadId = leadId
  state.thread = null
  state.threadEnrollments = []
  state.loadingThread = true; render()
  try {
    state.thread = await api('/thread?leadId=' + encodeURIComponent(leadId))
    // Fire-and-forget enrollment lookup so the banner appears as soon as we have it.
    loadThreadEnrollments(leadId).then(render)
  } catch (err) {
    toast(`Failed to load thread: ${err.message}`, 'err')
  } finally {
    state.loadingThread = false; render()
    scrollMessagesToBottom()
  }
  // Mark thread read (best effort, don't block UI)
  try {
    await api('/mark-read', { method: 'POST', body: JSON.stringify({ leadId }) })
    // Optimistically zero out the unread badge for this lead in our local list
    const local = state.threads.find(t => t.leadId === leadId)
    if (local) { local.unreadCount = 0; render() }
  } catch {}
}

// Read a File into a base64 string (no data URL prefix).
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader()
    r.onload = () => {
      const result = r.result || ''
      const idx = String(result).indexOf(',')
      resolve(idx >= 0 ? String(result).slice(idx + 1) : '')
    }
    r.onerror = () => reject(r.error)
    r.readAsDataURL(file)
  })
}

async function attachFile(file) {
  if (!file) return
  // Reject anything too large up front (Vercel body limit ~4.5MB; base64 inflates 33%).
  if (file.size > 3.2 * 1024 * 1024) {
    toast(`File too large (${(file.size/1024/1024).toFixed(1)}MB) — keep under ~3MB`, 'err')
    return
  }
  const dataBase64 = await fileToBase64(file)
  const kind = file.type.startsWith('video/') ? 'video' : 'image'
  state.attachment = {
    filename: file.name,
    contentType: file.type,
    dataBase64,
    previewUrl: URL.createObjectURL(file),
    kind
  }
  render()
}

function clearAttachment() {
  if (state.attachment?.previewUrl) URL.revokeObjectURL(state.attachment.previewUrl)
  state.attachment = null
  render()
}

async function uploadAttachmentIfAny() {
  if (!state.attachment) return null
  const { filename, contentType, dataBase64 } = state.attachment
  const r = await api('/upload', {
    method: 'POST',
    body: JSON.stringify({ filename, contentType, dataBase64 })
  })
  return r.url
}

async function sendReply(text) {
  if (!state.thread || !state.thread.replyPhone) { toast('No phone on file to reply to', 'err'); return }
  if (!text && !state.attachment) return
  state.sending = true; render()
  try {
    const mediaUrl = await uploadAttachmentIfAny()
    await api('/reply', {
      method: 'POST',
      body: JSON.stringify({
        leadId: state.thread.leadId,
        phone: state.thread.replyPhone,
        message: text,
        mediaUrl: mediaUrl || undefined
      })
    })
    toast('Sent', 'ok')
    clearAttachment()
    await Promise.all([selectThread(state.thread.leadId), loadThreads()])
  } catch (err) {
    toast(`Send failed: ${err.message}`, 'err')
  } finally {
    state.sending = false; render()
  }
}

// ---------- Sequences ---------
async function openSequencesModal() {
  state.sequencesModal = { view: 'list', sequences: [], editing: null, leadStatuses: [], saving: false, loading: true }
  render()
  // Fetch sequences + Close lead statuses in parallel — statuses are used to
  // resolve trigger_status_id to a human label in the list + edit views.
  const [seqRes, statRes] = await Promise.allSettled([
    api('/sequences'),
    api('/lead-statuses')
  ])
  if (seqRes.status === 'fulfilled') {
    state.sequencesModal.sequences = seqRes.value.sequences
  } else {
    toast(`Failed to load sequences: ${seqRes.reason?.message || seqRes.reason}`, 'err')
  }
  if (statRes.status === 'fulfilled') {
    state.sequencesModal.leadStatuses = statRes.value.statuses || []
  }
  state.sequencesModal.loading = false
  render()
}

function statusLabelFor(statusId) {
  const m = state.sequencesModal
  if (!statusId || !m) return statusId || ''
  const found = (m.leadStatuses || []).find(s => s.id === statusId)
  return found ? found.label : statusId
}
function closeSequencesModal() { state.sequencesModal = null; render() }

function newSequenceDraft() {
  return {
    id: null,
    name: '',
    trigger_type: 'manual',
    trigger_status_id: '',
    on_reply_behavior: 'pause',
    active: true,
    steps: []
  }
}

async function startEditSequence(seq) {
  // For a new draft we can transition immediately. For an existing sequence
  // the list-row only carries the parent record — fetch the full sequence so
  // `editing.steps` is populated (the editor blows up without it).
  if (!seq) {
    state.sequencesModal.view = 'edit'
    state.sequencesModal.editing = newSequenceDraft()
    render()
    return
  }
  state.sequencesModal.view = 'edit'
  state.sequencesModal.editing = { ...structuredClone(seq), steps: [] }
  state.sequencesModal.loading = true
  render()
  try {
    const full = await api('/sequences?id=' + encodeURIComponent(seq.id))
    state.sequencesModal.editing = structuredClone({
      ...full,
      steps: Array.isArray(full.steps) ? full.steps : []
    })
  } catch (err) {
    toast(`Failed to load sequence: ${err.message}`, 'err')
    state.sequencesModal.view = 'list'
    state.sequencesModal.editing = null
  } finally {
    state.sequencesModal.loading = false
    render()
  }
}

function addStep() {
  const e = state.sequencesModal?.editing
  if (!e) return
  e.steps.push({ delay_seconds: 0, message_template: '', media_url: '' })
  render()
}
function removeStep(i) {
  const e = state.sequencesModal?.editing
  if (!e) return
  e.steps.splice(i, 1)
  render()
}
function updateStep(i, field, value) {
  const e = state.sequencesModal?.editing
  if (!e) return
  e.steps[i][field] = value
  // No render — input is the source of truth and React-style re-render would
  // blow the user's caret position in the textarea.
}

async function saveSequence() {
  const e = state.sequencesModal?.editing
  if (!e) return
  if (!e.name.trim()) { toast('Name required', 'err'); return }
  state.sequencesModal.saving = true; render()
  const payload = {
    name: e.name.trim(),
    triggerType: e.trigger_type,
    triggerStatusId: e.trigger_type === 'lead_status' ? (e.trigger_status_id || null) : null,
    onReplyBehavior: e.on_reply_behavior,
    active: e.active,
    steps: e.steps.map((s, i) => ({
      delaySeconds: Number(s.delay_seconds) || 0,
      messageTemplate: s.message_template || null,
      mediaUrl: s.media_url || null,
      position: i
    }))
  }
  try {
    const saved = e.id
      ? await api('/sequences?id=' + encodeURIComponent(e.id), { method: 'PATCH', body: JSON.stringify(payload) })
      : await api('/sequences', { method: 'POST', body: JSON.stringify(payload) })
    toast('Saved', 'ok')
    state.sequencesModal.view = 'list'
    state.sequencesModal.editing = null
    const { sequences } = await api('/sequences')
    state.sequencesModal.sequences = sequences
  } catch (err) {
    toast(`Save failed: ${err.message}`, 'err')
  } finally {
    state.sequencesModal.saving = false
    render()
  }
}

async function uploadWorkflowMedia(file) {
  if (!file) return
  if (file.size > 3.2 * 1024 * 1024) {
    state.mediaUploader.error = `File too large (${(file.size/1024/1024).toFixed(1)}MB) — keep under ~3MB`
    render(); return
  }
  state.mediaUploader = { uploading: true, url: null, filename: file.name, error: null }
  render()
  try {

    const r = await api('/upload', {

    })
    state.mediaUploader = { uploading: false, url: r.url, filename: file.name, error: null }
  } catch (err) {
    state.mediaUploader = { uploading: false, url: null, filename: file.name, error: err.message }

// ---------- Push notifications ---------
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4)
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/')
  const raw = atob(base64)
  const out = new Uint8Array(raw.length)
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i)
  return out
}

async function refreshNotificationState() {
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    state.notifications = 'unsupported'
    return
  }
  state.notifications = Notification.permission
}

async function enableNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('Push not supported on this device', 'err'); return
  }
  try {
    const reg = await navigator.serviceWorker.ready
    let permission = Notification.permission
    if (permission === 'default') permission = await Notification.requestPermission()
    if (permission !== 'granted') { state.notifications = permission; render(); return }

    let sub = await reg.pushManager.getSubscription()
    if (!sub) {
      const { publicKey } = await api('/push-subscribe')
      if (!publicKey) throw new Error('server missing VAPID public key')
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      })
    }
    const json = sub.toJSON()
    await api('/push-subscribe', {
      method: 'POST',
      body: JSON.stringify({ endpoint: json.endpoint, keys: json.keys })
    })
    state.notifications = 'granted'
    toast('Notifications enabled', 'ok')
    render()
  } catch (err) {
    toast(`Push setup failed: ${err.message}`, 'err')
  }
}

function renderMessageBubble(m) {
  const isOut = m.direction === 'outbound'
  const children = []

  // Media (image/video) above text
  if (m.mediaUrl) {
    const isVideo = /\.(mp4|mov|m4v|webm)(\?|$)/i.test(m.mediaUrl)
    children.push(h('div', { class: 'media' },
      isVideo
        ? h('video', { src: m.mediaUrl, controls: true, playsinline: true, preload: 'metadata' })
        : h('img', { src: m.mediaUrl, alt: 'attachment', loading: 'lazy' })
    ))
  }

  // Reactions overlay
  const reactions = m.reactions || []
  if (reactions.length > 0) {
    children.push(h('div', { class: 'reactions' },
      reactions.map(r => REACTION_EMOJI[r.reaction] || r.reaction)
    ))
  }

  // Body text (allow empty for media-only)
  if (m.message) children.push(document.createTextNode(m.message))
  else if (!m.mediaUrl) children.push('(no body)')

  children.push(h('span', { class: 'at' }, formatTime(m.at)))

  const bubble = h('div', {
    class: 'msg ' + (isOut ? 'outbound' : 'inbound'),
    oncontextmenu: (e) => { e.preventDefault(); openReactPicker(m, bubble) },
    ondblclick: () => openReactPicker(m, bubble)
  }, children)

  // Long-press for mobile (touchstart + 500ms timer)
  let pressTimer = null
  bubble.addEventListener('touchstart', () => {
    pressTimer = setTimeout(() => openReactPicker(m, bubble), 500)
  }, { passive: true })
  const cancel = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null } }
  bubble.addEventListener('touchend', cancel)
  bubble.addEventListener('touchmove', cancel)
  bubble.addEventListener('touchcancel', cancel)

  return bubble
}

                h('option', { value: 'pause' }, 'Pause (recommended)'),
                h('option', { value: 'unenroll' }, 'Unenroll permanently'),
                h('option', { value: 'continue' }, 'Continue anyway')
              )
            ),
            h('div', { class: 'seq-field' },
              h('label', {}, 'Active'),
              h('select', { value: e.active ? 'yes' : 'no', onchange: (ev) => { e.active = ev.target.value === 'yes' } },
                h('option', { value: 'yes' }, 'Active'),
                h('option', { value: 'no' }, 'Draft / paused')
              )
            )
          ),
          h('div', { class: 'seq-field' },
            h('label', {}, 'Steps'),
            h('div', {},
              e.steps.length === 0 ? h('div', { class: 'empty' }, 'No steps yet — add your first message.') : null,
              e.steps.map((s, i) =>
                h('div', { class: 'seq-step' },
                  h('div', { class: 'step-head' },
                    h('div', { class: 'step-num' }, String(i + 1)),
                    h('div', { class: 'grow' }, `fires at +${formatDelay(s.delay_seconds)}`),
                    h('button', { class: 'icon-btn', onclick: () => removeStep(i) }, '🗑')
                  ),
                  h('div', { class: 'row' },
                    h('div', { class: 'seq-field' },
                      h('label', {}, 'Delay from enrollment (seconds)'),
                      h('input', { type: 'number', min: '0', value: s.delay_seconds, oninput: (ev) => updateStep(i, 'delay_seconds', ev.target.value) })
                    ),
                    h('div', { class: 'seq-field' },
                      h('label', {}, 'Quick set'),
                      h('select', { value: '', onchange: (ev) => { if (ev.target.value) { s.delay_seconds = Number(ev.target.value); render() } } },
                        h('option', { value: '' }, '— pick —'),
                        h('option', { value: '0' }, 'Immediately'),
                        h('option', { value: '900' }, '15 minutes'),
                        h('option', { value: '3600' }, '1 hour'),
                        h('option', { value: '86400' }, '1 day'),
                        h('option', { value: '172800' }, '2 days'),
                        h('option', { value: '432000' }, '5 days'),
                        h('option', { value: '604800' }, '1 week'),
                        h('option', { value: '1209600' }, '2 weeks')
                      )
                    )
                  ),
                  h('div', { class: 'seq-field' },
                    h('label', {}, 'Message (supports {{lead.display_name}}, {{lead.contact.name}})'),
                    h('textarea', {
                      placeholder: 'Hi {{lead.display_name}}, …',
                      value: s.message_template || '',
                      oninput: (ev) => updateStep(i, 'message_template', ev.target.value)
                    })
                  ),
                  h('div', { class: 'seq-field' },
                    h('label', {}, 'Media URL (optional — use 🖼️ on the inbox to upload)'),
                    h('input', { type: 'text', value: s.media_url || '', placeholder: 'https://...', oninput: (ev) => updateStep(i, 'media_url', ev.target.value) })
                  )
                )
              ),
              h('button', { class: 'btn btn-ghost', style: 'margin-top: 4px;', onclick: addStep }, '+ Add step')
            )
          )
        ),
        h('div', { class: 'modal-foot' },
          h('button', { class: 'btn btn-ghost', onclick: () => { m.view='list'; m.editing=null; render() } }, 'Cancel'),
          h('button', { class: 'btn btn-primary', disabled: m.saving, onclick: saveSequence }, m.saving ? 'Saving…' : 'Save sequence')
        )
      )
    )
  }

  // Default: list view
  return h('div', { class: 'modal-backdrop', onclick: (e) => { if (e.target.classList.contains('modal-backdrop')) closeSequencesModal() } },
    h('div', { class: 'modal', style: 'max-width: 560px;' },
      h('div', { class: 'modal-head' },
        h('h3', {}, 'Sequences'),
        h('button', { class: 'btn btn-primary', onclick: () => startEditSequence(null) }, '+ New'),
        h('button', { class: 'icon-btn', onclick: closeSequencesModal }, '✕')
      ),
      h('div', { class: 'modal-body' },
        m.loading ? h('div', { class: 'empty' }, 'Loading…') :
        m.sequences.length === 0 ? h('div', { class: 'empty' }, 'No sequences yet. Create one with + New.') :
        m.sequences.map(s =>
          h('div', { class: 'seq-row' },
            h('div', { class: 'meta' },
              h('div', { class: 'nm' }, s.name),
              h('div', { class: 'sub' },
                (s.trigger_type === 'lead_status'
                  ? `Status: ${statusLabelFor(s.trigger_status_id)}`
                  : 'Manual'),
                ' · on reply: ',
                s.on_reply_behavior
              )
            ),
            h('div', { class: 'actions' },
              h('span', { class: 'pill ' + (s.active ? 'on' : 'off') }, s.active ? 'active' : 'off'),
              h('button', { class: 'btn btn-ghost', onclick: () => toggleSequenceActive(s) }, s.active ? 'Pause' : 'Activate'),
              h('button', { class: 'btn btn-ghost', onclick: () => startEditSequence(s) }, 'Edit'),
              h('button', { class: 'btn btn-ghost', onclick: () => deleteSequence(s) }, 'Delete')
            )
          )
        )
      )
    )
  )
}

function formatDelay(sec) {
  sec = Number(sec) || 0
  if (sec === 0) return 'send immediately'
  if (sec < 60) return `${sec}s`
  if (sec < 3600) return `${Math.round(sec/60)} min`
  if (sec < 86400) return `${Math.round(sec/3600)} hr`
  return `${Math.round(sec/86400)} day${sec >= 172800 ? 's' : ''}`
}

function viewThreadEnrollmentBanner() {
  const enrollments = (state.threadEnrollments || []).filter(e => e.status === 'active' || e.status === 'paused')
  if (enrollments.length === 0) return null
  // If multiple, show the most actionable one (paused > active).
  const e = enrollments.find(x => x.status === 'paused') || enrollments[0]
  const isPaused = e.status === 'paused'
  return h('div', { class: 'thread-banner' + (isPaused ? ' paused' : '') },
    h('div', { class: 'label' },
      isPaused
        ? [h('strong', {}, 'Sequence paused'), ` — ${e.paused_reason || 'reply received'}`]
        : [h('strong', {}, 'Active in sequence'), ` — step ${e.next_step_position + 1}`]
    ),
    isPaused
      ? [
          h('button', { onclick: () => enrollmentAction(e.id, 'resume') }, 'Resume'),
          h('button', { onclick: () => enrollmentAction(e.id, 'unenroll') }, 'Remove')
        ]
      : [
          h('button', { onclick: () => enrollmentAction(e.id, 'pause') }, 'Pause'),
          h('button', { onclick: () => enrollmentAction(e.id, 'unenroll') }, 'Remove')
        ]
  )
}

function viewMediaUploader() {
  if (!state.mediaUploader) return null
  const u = state.mediaUploader
  return h('div', { class: 'modal-backdrop', onclick: (e) => { if (e.target.classList.contains('modal-backdrop')) closeMediaUploader() } },
    h('div', { class: 'modal' },
      h('div', { class: 'modal-head' },
        h('h3', {}, 'Upload media for Close workflows'),
        h('button', { class: 'icon-btn', title: 'Close', onclick: closeMediaUploader }, '✕')
      ),
      h('div', { class: 'modal-body' },
        h('p', { style: 'color: var(--muted); font-size: 13px; margin: 0 0 12px;' },
          'Pick an image or short video (under ~3MB). You\'ll get a permanent public URL to paste into a Close workflow\'s "mediaUrl" body field.'
        ),
        h('input', {
          type: 'file',
          accept: 'image/*,video/mp4,video/quicktime',
          disabled: u.uploading,
          onchange: (e) => {
            const f = e.target.files?.[0]
            if (f) uploadWorkflowMedia(f)
          }
        }),
        u.uploading ? h('div', { class: 'empty' }, 'Uploading…') : null,
        u.error ? h('div', { class: 'err' }, u.error) : null,
        u.url
          ? h('div', { style: 'margin-top: 12px;' },
              h('label', {}, 'Public URL'),
              h('input', {
                value: u.url,
                readonly: true,
                onclick: (e) => e.target.select()
              }),
              h('div', { style: 'display: flex; gap: 8px; margin-top: 8px; align-items: center;' },
                h('button', { class: 'btn btn-primary', onclick: () => copyToClipboard(u.url) }, 'Copy URL'),
                h('a', { href: u.url, target: '_blank', rel: 'noopener', style: 'color: var(--accent-2); font-size: 13px;' }, 'Open in new tab')
              ),
              h('p', { style: 'color: var(--muted); font-size: 12px; margin-top: 14px;' },
                'Paste into a Close workflow HTTP step:'
              ),
              h('pre', {
                style: 'background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; overflow: auto; margin: 0;'
              }, JSON.stringify({
                phone: '{{lead.contact.phone}}',
                message: 'Optional caption',
                leadId: '{{lead.id}}',
                mediaUrl: u.url
              }, null, 2))
            )
          : null
      ),
      h('div', { class: 'modal-foot' },
        h('button', { class: 'btn btn-ghost', onclick: closeMediaUploader }, 'Done')
      )
    )
  )
}

function viewApp() {
  const notifBtnTitle =
    state.notifications === 'granted' ? 'Notifications on'
    : state.notifications === 'denied' ? 'Notifications blocked by browser'
    : state.notifications === 'unsupported' ? 'Notifications not supported here'
    : 'Enable notifications'
  return h('div', { class: 'app' + (state.selectedLeadId ? ' has-thread' : '') },
    h('div', { class: 'threads' },
      h('div', { class: 'threads-head' },
        h('h2', {}, 'Conversations'),
        h('button', { class: 'icon-btn', title: 'New message', onclick: openCompose }, '✎'),
        h('button', { class: 'icon-btn', title: 'Sequences (drip campaigns)', onclick: openSequencesModal }, '📋'),
        h('button', { class: 'icon-btn', title: 'Upload media for workflows', onclick: openMediaUploader }, '🖼️'),
        h('button', {
          class: 'icon-btn' + (state.notifications === 'granted' ? ' active' : ''),
          title: notifBtnTitle,
          onclick: enableNotifications,
          disabled: state.notifications === 'unsupported'
        }, state.notifications === 'granted' ? '🔔' : '🔕'),
        h('button', { class: 'icon-btn', title: 'Refresh', onclick: loadThreads }, '↻'),
        h('button', { class: 'icon-btn', title: 'Sign out', onclick: logout }, '⎋')
      ),
      viewThreadsList()
    ),
    h('div', { class: 'thread' }, viewThreadDetail()),
    viewCompose(),
    viewMediaUploader(),
    viewSequencesModal()
  )
}

function render() {
  const root = document.getElementById('root')
  root.innerHTML = ''
  root.appendChild(state.authed ? viewApp() : viewLogin())
}

// Poll for new messages every 20s while authed and visible.
setInterval(() => {
  if (state.authed && document.visibilityState === 'visible') {
    loadThreads()
    if (state.selectedLeadId) {
      api('/thread?leadId=' + encodeURIComponent(state.selectedLeadId))
        .then(t => { state.thread = t; render() })
        .catch(() => {})
    }
  }
}, 20000)

// Close the reaction picker on Escape or outside click.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.reactPicker) closeReactPicker()
})
document.addEventListener('click', (e) => {
  if (state.reactPicker && !e.target.closest('.react-picker') && !e.target.closest('.msg')) closeReactPicker()
})

// Service worker: register so the app is installable AND can show push notifications.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/imessage-sw.js', { scope: '/' }).catch(err => {
    console.warn('SW register failed', err)
  })
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data?.type === 'open-lead' && e.data.leadId) selectThread(e.data.leadId)
  })
}

;(async () => {
  await refreshNotificationState()
  await tryRestoreSession()
  if (state.authed) await loadThreads()
  render()
})()
</script>
</body>
</html>
